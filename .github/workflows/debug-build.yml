name: Flutter Android Release APK

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: windows-2025

    steps:
      # Checkout code
      - uses: actions/checkout@v5

      # Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      # Check Flutter version
      - name: Flutter Version
        run: flutter --version

      # Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Build Release APK
      - name: Build Release APK
        run: flutter build apk --release

      # Copy APK to root
      - name: Copy APK
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk | Select-Object -First 1
          Copy-Item $apk.FullName -Destination flutter-release.apk

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: flutter-release-apk
          path: flutter-release.apk
