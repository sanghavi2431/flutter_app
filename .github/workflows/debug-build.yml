name: Flutter iOS IPA Build

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v5

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      # Check Flutter version
      - name: Flutter Version
        run: flutter --version

      # Install Flutter dependencies
      - name: Install Flutter Dependencies
        run: flutter pub get

      # Select Xcode version
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # Verify Xcode version
      - name: Check Xcode Version
        run: xcodebuild -version

      # Install CocoaPods
      - name: Install Pods
        run: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod install --repo-update

      # Create temporary keychain
      - name: Create Keychain
        run: |
          security create-keychain -p temp123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp123 build.keychain

      # Import .p12 certificate
      - name: Import Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security import certificate.p12 \
          -k build.keychain \
          -P "$P12_PASSWORD" \
          -T /usr/bin/codesign

      # Install provisioning profile
      - name: Install Provisioning Profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $MOBILEPROVISION_BASE64 | base64 --decode > \
          ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # Setup App Store Connect API Key
      - name: Setup App Store Connect API Key
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys

          echo $APPSTORE_API_KEY_BASE64 | base64 --decode > \
          ~/private_keys/AuthKey.p8

      # Archive app with automatic provisioning updates
      - name: Archive App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          cd ios
          xcodebuild \
          -workspace Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -archivePath build/Runner.xcarchive \
          -allowProvisioningUpdates \
          archive

      # Export IPA
      - name: Export IPA
        run: |
          cd ios
          xcodebuild \
          -exportArchive \
          -archivePath build/Runner.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath build/ipa

      # Upload IPA artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: ios/build/ipa/*.ipa
